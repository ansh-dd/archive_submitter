services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://archive:archive@postgres:5432/archive
      CORS_ORIGINS: http://localhost:3000
      ARCHIVE_PROVIDER: mock
      TASK_MODE: celery
      EMBEDDED_WORKER: "false"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MAX_CONCURRENT_REQUESTS: 5
      MAX_RESPONSE_SIZE_MB: 10
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend_env
    depends_on:
      backend:
        condition: service_started

  beat:
    build: ./backend
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    environment: *backend_env
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
